[package]
name = "lattice-hermes-adapter"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[[bin]]
name = "lattice-hermes-broker"
path = "src/bin/lattice-hermes-broker.rs"
test = false
bench = false

[dependencies]
lattice-cjson = { path = "../lattice-cjson" }
lattice-contracts = { path = "../lattice-contracts" }
lattice-ports = { path = "../lattice-ports" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Direct Win32 Job Object ownership is isolated to `windows_job.rs`.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
