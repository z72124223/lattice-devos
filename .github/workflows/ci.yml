name: verify

on:
  pull_request:
  push:
    branches:
      - product/lattice-control-mvp

permissions:
  contents: read

jobs:
  windows-installer-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test installer and guarded configuration changes
        shell: pwsh
        run: |
          $installerTests = @(
            'test_lattice_one_click_install.py',
            'test_lattice_customer_runtime.py',
            'test_lattice_mcp_config.py',
            'test_lattice_runtime_update.py',
            'test_lattice_install_assets.py',
            'test_lattice_codex_profile.py',
            'test_lattice_overlap_audit.py',
            'test_lattice_wsl_host.py',
            'test_lattice_bundle.py',
            'test_lattice_customer_backup.py',
            'test_verify_lattice_loaded_crt.py',
            'test_build_lattice_windows_installer.py'
          )
          foreach ($testFile in $installerTests) {
            python -I -B -S -m unittest discover -s scripts -p $testFile -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  rust-postgres-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: >-
          cargo test --locked
          -p lattice-postgres-store
          -p lattice-postgres-writer-lease
          -p lattice-postgres-codebase-memory
      - run: cargo test --locked -p lattice-runtime --test task094_writer_v3_transition
      - run: >-
          cargo clippy --locked --all-targets
          -p lattice-postgres-store
          -p lattice-postgres-writer-lease
          -p lattice-postgres-codebase-memory
          -- -D warnings
