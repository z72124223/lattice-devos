name: Windows candidate installation

on:
  workflow_dispatch:
  push:
    branches:
      - docs/codex-assisted-install-20260915
    paths:
      - .github/workflows/windows-candidate-acceptance.yml
      - scripts/verify-lattice-windows-installer.ps1

permissions:
  contents: read

concurrency:
  group: windows-candidate-rc7
  cancel-in-progress: false

jobs:
  install-public-candidate:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the exact public candidate
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LATTICE-Setup-rc7.exe'
          Invoke-WebRequest -Uri 'https://github.com/z72124223/lattice-devos/releases/download/v2.0.1-rc.7/LATTICE-Setup-v2.0.1-rc.7-windows-x64.exe' -OutFile $installer -TimeoutSec 300
          $expected = '563da24e170fedda5362b3643154684ac26cd5bea58e38b3fe4be35aea44613e'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'INSTALLER_SHA256_MISMATCH'
          }
      - name: Install in a fresh isolated environment and verify live modules
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File scripts/verify-lattice-windows-installer.ps1 `
            -InstallerPath (Join-Path $env:RUNNER_TEMP 'LATTICE-Setup-rc7.exe') `
            -ExpectedSha256 '563da24e170fedda5362b3643154684ac26cd5bea58e38b3fe4be35aea44613e' `
            -TrialRoot (Join-Path $env:RUNNER_TEMP 'lattice independent trial') `
            -Output (Join-Path $env:RUNNER_TEMP 'lattice-installer-result.json')
          exit $LASTEXITCODE
      - name: Retain only the sanitized acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-2025-rc7-result
          path: ${{ runner.temp }}/lattice-installer-result.json
          if-no-files-found: warn
          retention-days: 7
