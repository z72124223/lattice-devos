[package]
name = "lattice-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "=0.4.3"
lattice-codebase-memory = { path = "../../crates/lattice-codebase-memory" }
lattice-approval-verifier = { path = "../../crates/lattice-approval-verifier" }
lattice-artifact-store = { path = "../../crates/lattice-artifact-store" }
lattice-codex-adapter = { path = "../../crates/lattice-codex-adapter" }
lattice-cjson = { path = "../../crates/lattice-cjson" }
lattice-contracts = { path = "../../crates/lattice-contracts" }
lattice-foreman-state = { path = "../../crates/lattice-foreman-state" }
lattice-graphify-adapter = { path = "../../crates/lattice-graphify-adapter" }
lattice-gateway-ipc = { path = "../../crates/lattice-gateway-ipc" }
lattice-hermes-adapter = { path = "../../crates/lattice-hermes-adapter" }
lattice-openclaw-adapter = { path = "../../crates/lattice-openclaw-adapter" }
lattice-orchestrator = { path = "../../crates/lattice-orchestrator" }
lattice-policy = { path = "../../crates/lattice-policy" }
lattice-ports = { path = "../../crates/lattice-ports" }
lattice-postgres-codebase-memory = { path = "../../crates/lattice-postgres-codebase-memory" }
lattice-postgres-foreman = { path = "../../crates/lattice-postgres-foreman" }
lattice-postgres-store = { path = "../../crates/lattice-postgres-store" }
lattice-postgres-writer-lease = { path = "../../crates/lattice-postgres-writer-lease" }
lattice-project-registry = { path = "../../crates/lattice-project-registry" }
lattice-task-ledger = { path = "../../crates/lattice-task-ledger" }
lattice-task-domain = { path = "../../crates/lattice-task-domain" }
lattice-writer-lease = { path = "../../crates/lattice-writer-lease" }
postgres = { version = "=0.19.14", default-features = false }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
time = { version = "=0.3.54", default-features = false, features = ["formatting", "std"] }
unicode-normalization = "=0.1.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
] }

# Audited Win32 calls are isolated to exact file-identity inspection in
# `composition.rs`, the registered-project bridge, and the managed verifier,
# plus process-tree observation in `managed_process_observer.rs`; the rest of
# the crate remains unsafe-free.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "lattice-runtime"
path = "src/main.rs"

[[bin]]
name = "latticed"
path = "src/bin/latticed.rs"

[[bin]]
name = "lattice-full-chain"
path = "src/bin/lattice-full-chain.rs"

[[bin]]
name = "lattice-live-fault-acceptance"
path = "src/bin/lattice-live-fault-acceptance.rs"
