[workspace]
members = [
    "apps/lattice-cli",
    "apps/lattice-runtime",
    "crates/lattice-codex-adapter",
    "crates/lattice-cjson",
    "crates/lattice-codebase-memory",
    "crates/lattice-contracts",
    "crates/lattice-graphify-adapter",
    "crates/lattice-hermes-adapter",
    "crates/lattice-orchestrator",
    "crates/lattice-openclaw-adapter",
    "crates/lattice-core",
    "crates/lattice-foreman-state",
    "crates/lattice-gateway-ipc",
    "crates/lattice-approval-verifier",
    "crates/lattice-artifact-store",
    "crates/lattice-policy",
    "crates/lattice-ports",
    "crates/lattice-postgres-codebase-memory",
    "crates/lattice-postgres-foreman",
    "crates/lattice-postgres-writer-lease",
    "crates/lattice-postgres-store",
    "crates/lattice-project-registry",
    "crates/lattice-task-ledger",
    "crates/lattice-task-domain",
    "crates/lattice-writer-lease",
]
exclude = ["third_party/postgres-0.19.14"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
postgres = { path = "third_party/postgres-0.19.14" }
